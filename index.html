<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Gesture support -->
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

  <style>
    #discoverButton {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 9999;

      padding: 14px 28px;
      border: 0;
      border-radius: 24px;

      background: #ffffff;
      color: #222222;

      font-size: 16px;
      font-weight: bold;

      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }

    #infoPanel {
      display: none;

      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      z-index: 10000;

      width: min(82vw, 360px);
      padding: 24px;

      border-radius: 18px;

      background: rgba(255,255,255,.96);
      color: #222222;

      font-family: Arial, sans-serif;
      text-align: center;

      box-shadow: 0 8px 30px rgba(0,0,0,.3);
    }

    #infoPanel h2 {
      margin: 0 0 8px;
    }

    #infoPanel p {
      line-height: 1.5;
      margin: 8px 0;
    }

    #closeButton {
      margin-top: 12px;
      padding: 10px 20px;

      border: 0;
      border-radius: 18px;

      background: #222222;
      color: #ffffff;

      font-size: 14px;
    }
  </style>
</head>


<body style="margin:0; overflow:hidden;">

  <!-- Discover button -->
  <button id="discoverButton">
    DISCOVER LUTARA
  </button>


  <!-- Information panel -->
  <div id="infoPanel">

    <h2>LUTARA</h2>

    <p>
      <strong>Banjara Textile</strong>
    </p>

    <p>
      Traditional Banjara textile craft,
      brought into a contemporary visual experience.
    </p>

    <p>
      <strong>Explore:</strong>
      Embroidery • Textiles • Craft
    </p>

    <p>
      <strong>Let's connect & collaborate.</strong>
    </p>

    <button id="closeButton">
      CLOSE
    </button>

  </div>


  <!-- ==========================================================
       AR SCENE
       ========================================================== -->

  <a-scene
    vr-mode-ui="enabled:false;"
    loading-screen="enabled:false;"
    arjs="trackingMethod:best; sourceType:webcam; debugUIEnabled:false;"
    id="scene"
    embedded
    gesture-detector
  >

    <!-- CUSTOM MARKER -->
    <!-- marker.patt is in the SAME folder as index.html -->

    <a-marker
      id="markerA"
      type="pattern"
      preset="custom"
      url="marker.patt"
      raycaster="objects:.clickable"
      emitevents="true"
      cursor="fuse:false; rayOrigin:mouse;"
    >

      <!-- ======================================================
           ORIGINAL VISITING CARD
           ====================================================== -->

      <a-image
        id="cardArtwork"
        src="asset.png"
        width="1.75"
        height="1"
        class="clickable"
        rotation="-90 0 0"
        gesture-handler>
      </a-image>


      <!-- ======================================================
           LUTARA LOGO ANIMATION
           ====================================================== -->

      <a-entity
        id="logoAnimation"
        visible="false"
        position="0.81 -0.03 0.012"
        scale="1.25 1.25 1"
      >

        <!-- ORANGE LEFT -->
        <a-image
          id="orangeLeft"
          src="orange_left.png"
          width="1.75"
          height="1"
          rotation="-90 0 0"
          material="transparent:true; alphaTest:0.01;">
        </a-image>


        <!-- ORANGE RIGHT -->
        <a-image
          id="orangeRight"
          src="orange_right.png"
          width="1.75"
          height="1"
          rotation="-90 0 0"
          material="transparent:true; alphaTest:0.01;">
        </a-image>


        <!-- BURGUNDY TOP -->
        <a-image
          id="burgundyTop"
          src="burgundy_top.png"
          width="1.75"
          height="1"
          rotation="-90 0 0"
          material="transparent:true; alphaTest:0.01;">
        </a-image>


        <!-- BURGUNDY BOTTOM -->
        <a-image
          id="burgundyBottom"
          src="burgundy_bottom.png"
          width="1.75"
          height="1"
          rotation="-90 0 0"
          material="transparent:true; alphaTest:0.01;">
        </a-image>

      </a-entity>

    </a-marker>


    <!-- CAMERA -->
    <a-entity camera></a-entity>

  </a-scene>


<script>

  /* ============================================================
     ELEMENTS
     ============================================================ */

  const marker =
    document.getElementById('markerA');

  const logo =
    document.getElementById('logoAnimation');

  const discoverButton =
    document.getElementById('discoverButton');

  const infoPanel =
    document.getElementById('infoPanel');

  const closeButton =
    document.getElementById('closeButton');


  /* Logo pieces */

  const orangeLeft =
    document.getElementById('orangeLeft');

  const orangeRight =
    document.getElementById('orangeRight');

  const burgundyTop =
    document.getElementById('burgundyTop');

  const burgundyBottom =
    document.getElementById('burgundyBottom');


  const pieces = [
    orangeLeft,
    orangeRight,
    burgundyTop,
    burgundyBottom
  ];


  /* ============================================================
     ANIMATION CONTROL
     ============================================================ */

  let animationToken = 0;

  let rafIds = [];


  /* ============================================================
     STOP MOTION
     ============================================================ */

  function clearMotion() {

    rafIds.forEach(
      cancelAnimationFrame
    );

    rafIds = [];

  }


  /* ============================================================
     RESET LOGO
     ============================================================ */

  function resetPieces() {

    clearMotion();

    pieces.forEach(piece => {

      piece.setAttribute(
        'position',
        '0 0 0'
      );

    });

  }


  /* ============================================================
     WAIT
     ============================================================ */

  function wait(ms, token) {

    return new Promise(resolve => {

      setTimeout(() => {

        resolve(
          token === animationToken
        );

      }, ms);

    });

  }


  /* ============================================================
     SWEEP ANIMATION
     
     The elements move around the centre rather than
     simply rotating in place.
     ============================================================ */

  function sweepPair(
    pieceA,
    pieceB,
    angleA,
    angleB,
    duration,
    token
  ) {

    return new Promise(resolve => {

      const startTime =
        performance.now();

      const radiusA = 0.15;
      const radiusB = 0.15;


      /* Smooth ease-out */

      const ease = t =>
        1 - Math.pow(1 - t, 3);


      function frame(now) {

        if (
          token !== animationToken
        ) {

          resolve(false);
          return;

        }


        let t =
          Math.min(
            (now - startTime) / duration,
            1
          );


        t = ease(t);


        const radA =
          angleA *
          t *
          Math.PI /
          180;

        const radB =
          angleB *
          t *
          Math.PI /
          180;


        /* LEFT / FIRST ELEMENT */

        pieceA.setAttribute(
          'position',
          `
          ${Math.cos(radA) * radiusA}
          ${Math.sin(radA) * radiusA}
          0
          `
        );


        /* RIGHT / SECOND ELEMENT */

        pieceB.setAttribute(
          'position',
          `
          ${Math.cos(radB) * radiusB}
          ${Math.sin(radB) * radiusB}
          0
          `
        );


        if (t < 1) {

          const id =
            requestAnimationFrame(frame);

          rafIds.push(id);

        }

        else {

          resolve(true);

        }

      }


      const id =
        requestAnimationFrame(frame);

      rafIds.push(id);

    });

  }


  /* ============================================================
     MAIN LOGO ANIMATION
     
     CARD
       ↓
     LOGO
       ↓
     ORANGE
       ↓
     BURGUNDY
       ↓
     ORANGE
       ↓
     BURGUNDY
       ↓
     ORANGE
       ↓
     BURGUNDY
       ↓
     FINAL LOGO
     ============================================================ */

  async function playLogoAnimation() {

    animationToken++;

    const token =
      animationToken;


    resetPieces();


    /* ----------------------------------------------------------
       CARD APPEARS FIRST
       ---------------------------------------------------------- */

    await wait(
      900,
      token
    );


    if (
      token !== animationToken
    ) return;


    /* ----------------------------------------------------------
       LOGO APPEARS
       ---------------------------------------------------------- */

    logo.setAttribute(
      'visible',
      true
    );


    /* Hold complete logo */

    await wait(
      650,
      token
    );


    if (
      token !== animationToken
    ) return;


    /* ----------------------------------------------------------
       3 ROUNDS
       ---------------------------------------------------------- */

    for (
      let round = 0;
      round < 3;
      round++
    ) {


      /* ========================================================
         ORANGE SWEEP
         ======================================================== */

      if (
        !(await sweepPair(
          orangeLeft,
          orangeRight,
          -70,
          70,
          650,
          token
        ))
      ) return;


      /* ORANGE RETURNS */

      if (
        !(await sweepPair(
          orangeLeft,
          orangeRight,
          70,
          -70,
          650,
          token
        ))
      ) return;


      await wait(
        120,
        token
      );


      if (
        token !== animationToken
      ) return;


      /* ========================================================
         BURGUNDY SWEEP
         ======================================================== */

      if (
        !(await sweepPair(
          burgundyTop,
          burgundyBottom,
          70,
          -70,
          650,
          token
        ))
      ) return;


      /* BURGUNDY RETURNS */

      if (
        !(await sweepPair(
          burgundyTop,
          burgundyBottom,
          -70,
          70,
          650,
          token
        ))
      ) return;


      await wait(
        180,
        token
      );


      if (
        token !== animationToken
      ) return;

    }


    /* ============================================================
       FINAL RESET
       ============================================================ */

    resetPieces();

  }


  /* ============================================================
     MARKER FOUND
     ============================================================ */

  marker.addEventListener(
    'markerFound',
    () => {

      discoverButton.style.display =
        'block';

      playLogoAnimation();

    }
  );


  /* ============================================================
     MARKER LOST
     ============================================================ */

  marker.addEventListener(
    'markerLost',
    () => {

      animationToken++;

      logo.setAttribute(
        'visible',
        false
      );

      resetPieces();

      discoverButton.style.display =
        'none';

      infoPanel.style.display =
        'none';

    }
  );


  /* ============================================================
     DISCOVER
     ============================================================ */

  discoverButton.addEventListener(
    'click',
    () => {

      infoPanel.style.display =
        'block';

    }
  );


  /* ============================================================
     CLOSE
     ============================================================ */

  closeButton.addEventListener(
    'click',
    () => {

      infoPanel.style.display =
        'none';

    }
  );

</script>

</body>
</html>
